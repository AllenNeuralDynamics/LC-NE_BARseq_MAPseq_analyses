# Conda environment for the LC-NE BARseq/MAPseq analyses. Lists the R
# packages used by the capsule's scripts; transitive deps resolve
# automatically.
name: barseq-r4
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3.0
  - r-matrix=1.6_5
  - r-tidyverse=2.0.0
  - r-seurat=5.3.0
  - r-sctransform=0.4.2
  - r-clustree=0.5.1
  - r-viridis=0.6.5
  - r-gplots=3.2.0
  - r-pheatmap=1.0.13
  - r-fnn=1.1.4.1
  - r-patchwork=1.3.2
  - r-rcolorbrewer=1.1_3
  - r-readxl=1.4.5
  - r-digest=0.6.37
  - r-proxy=0.4_27
  - r-matrixstats=1.5.0
  - r-doparallel=1.0.17
  - r-cowplot=1.2.0
  - r-ggrepel=0.9.6
  - r-gridextra=2.3
  - r-igraph=1.5.1
  - r-knitr=1.50
  - bioconductor-singlecellexperiment=1.24.0
  - bioconductor-metaneighbor=1.22.0
  - bioconductor-scater=1.30.1
  - bioconductor-scran=1.30.0
  - bioconductor-biocparallel=1.36.0
  - bioconductor-biocneighbors=1.20.0
  - bioconductor-limma=3.58.1
  - bioconductor-edger=4.0.16
